name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, types, tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version, and the version the lab runs.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy src
      - name: Test
        # Fully offline: tests use a fake LLM and mocked HTTP, so no API key
        # or Wazuh cluster is needed.
        run: pytest -q

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t agentic-soc:ci .
      - name: Smoke test
        run: docker run --rm agentic-soc:ci python -m agentic_soc --version
